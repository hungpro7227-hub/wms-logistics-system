version: '3.8'
services:
  product-service:
    build: ./product-service
    ports:
      - "8081:8081"
    environment:
      - DB_HOST=db
    depends_on:
      - db

  inventory-service:
    build: ./inventory-service
    ports:
      - "8082:8082"
    depends_on:
      - db

  order-service:
    build: ./order-service
    ports:
      - "8083:8083"
    depends_on:
      - db

  shipping-service:
    build: ./shipping-service
    ports:
      - "8084:8084"
    depends_on:
      - db

  db:
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=wms_db
    ports:
      - "3306:3306"